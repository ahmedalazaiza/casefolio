<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" fill="none">
  <!-- Background -->
  <rect width="1440" height="1080" fill="#F5F7FB"/>

  <!-- Logo slot (72x72, rounded 18px) -->
  <rect x="684" y="64" width="72" height="72" rx="18" fill="#E9EEF8"/>
  <g transform="translate(710, 90)" stroke="#5A6478" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.5" y="1.5" width="17" height="17" rx="2.5"/>
    <circle cx="6.5" cy="6.5" r="1.5"/>
    <path d="M18.5 13L14.2 8.7L4.5 18.5"/>
  </g>

  <!-- Eyebrow -->
  <text x="720" y="172" text-anchor="middle" fill="#2E5BFF" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" letter-spacing="1.68">CASE STUDY · WEB APP · B2B SAAS</text>

  <!-- Title -->
  <text x="720" y="244" text-anchor="middle" fill="#0B1220" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="64" font-weight="700">Northwind: turning freight</text>
  <text x="720" y="314" text-anchor="middle" fill="#0B1220" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="64" font-weight="700">chaos into a calm control room</text>

  <!-- Subtitle -->
  <text x="720" y="368" text-anchor="middle" fill="#5A6478" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">Redesigning the dispatch console that 1,200 operators use to move 40,000</text>
  <text x="720" y="398" text-anchor="middle" fill="#5A6478" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">shipments a day.</text>

  <!-- Tags -->
  <g transform="translate(490, 424)">
    <rect x="0" y="0" width="136" height="36" rx="18" fill="none" stroke="#DDE3EE"/>
    <text x="68" y="23" text-anchor="middle" fill="#0B1220" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Product Design</text>

    <rect x="144" y="0" width="95" height="36" rx="18" fill="none" stroke="#DDE3EE"/>
    <text x="191.5" y="23" text-anchor="middle" fill="#0B1220" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Web App</text>

    <rect x="247" y="0" width="135" height="36" rx="18" fill="none" stroke="#DDE3EE"/>
    <text x="314.5" y="23" text-anchor="middle" fill="#0B1220" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Design System</text>

    <rect x="390" y="0" width="70" height="36" rx="18" fill="none" stroke="#DDE3EE"/>
    <text x="425" y="23" text-anchor="middle" fill="#0B1220" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">2026</text>
  </g>

  <!-- Browser Mockup Frame (1200w) -->
  <g transform="translate(120, 504)">
    <rect width="1200" height="540" rx="14" fill="#FFFFFF" stroke="#DDE3EE"/>
    <circle cx="21" cy="17" r="5" fill="#DDE3EE"/>
    <circle cx="39" cy="17" r="5" fill="#DDE3EE"/>
    <circle cx="57" cy="17" r="5" fill="#DDE3EE"/>
    <rect x="1" y="34" width="1198" height="505" rx="0" fill="#E9EEF8"/>
    <g transform="translate(572, 258)" stroke="#5A6478" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="48" height="48" rx="6"/>
      <circle cx="18" cy="18" r="4"/>
      <path d="M52 36L40 24L12 52"/>
    </g>
