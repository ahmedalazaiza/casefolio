<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <radialGradient id="cinemaCrimsonGlow" cx="72%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.42"/>
      <stop offset="48%" stop-color="#FF7A00" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0A0A0C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cinemaLeftGlow" cx="22%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0A0A0C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cinemaCardSurface" x1="80" y1="96" x2="820" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#17171F"/>
      <stop offset="100%" stop-color="#0F0F14"/>
    </linearGradient>
    <linearGradient id="cinemaPhoneScreen" x1="760" y1="140" x2="1070" y2="800" gradientUnits="userSpaceOnUse">
