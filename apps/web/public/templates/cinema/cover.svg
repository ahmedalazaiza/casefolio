      <rect x="206" y="36" width="28" height="24" rx="6" fill="#E50914"/>
      <rect x="244" y="36" width="28" height="24" rx="6" fill="#3F3F4E"/>
      <rect x="298" y="36" width="28" height="24" rx="6" fill="#3F3F4E"/>
