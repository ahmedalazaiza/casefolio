    <text x="56" y="384" fill="#9E9EA8" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" letter-spacing="1">INSTANT APPLE WALLET PASS</text>
    <rect x="56" y="402" width="88" height="88" rx="14" fill="#FAFAFC"/>
    <rect x="68" y="414" width="24" height="24" rx="4" fill="#0A0A0C"/>
    <rect x="108" y="414" width="24" height="24" rx="4" fill="#0A0A0C"/>
    <rect x="68" y="454" width="24" height="24" rx="4" fill="#0A0A0C"/>
    <rect x="98" y="444" width="16" height="16" rx="3" fill="#E50914"/>
    <rect x="116" y="460" width="16" height="18" rx="3" fill="#0A0A0C"/>

    <text x="160" y="430" fill="#FAFAFC" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="800">Gate B · Fast Track</text>
    <text x="160" y="454" fill="#9E9EA8" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="500">Auto-brightens on entry</text>
    <rect x="160" y="468" width="94" height="24" rx="12" fill="#052E16"/>
    <text x="207" y="484" text-anchor="middle" fill="#4ADE80" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700">Verified QR</text>

