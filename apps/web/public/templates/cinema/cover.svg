    <rect x="642" y="14" width="94" height="24" rx="12" fill="#291215" stroke="#E50914"/>
    <text x="689" y="30" text-anchor="middle" fill="#FCA5A5" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700">14 SECTIONS</text>

