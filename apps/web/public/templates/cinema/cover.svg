<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <radialGradient id="c-glow-a" cx="28%" cy="26%" r="58%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#FF7A00" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0A0A0C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-glow-b" cx="80%" cy="76%" r="54%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0A0A0C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c-web-fill" x1="88" y1="116" x2="860" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1418"/>
      <stop offset="55%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#1A1210"/>
    </linearGradient>
    <linearGradient id="c-phone-fill" x1="740" y1="130" x2="1080" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.72"/>
      <stop offset="52%" stop-color="#1E1216"/>
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0.52"/>
    </linearGradient>
    <linearGradient id="c-card-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#0A0A0C"/>
  <rect width="1200" height="900" fill="url(#c-glow-a)"/>
  <rect width="1200" height="900" fill="url(#c-glow-b)"/>

  <!-- Hybrid Web Browser Silhouette -->
  <g transform="translate(88, 120)">
    <rect width="780" height="580" rx="28" fill="url(#c-web-fill)" stroke="#2E2A32" stroke-width="2"/>
    <circle cx="34" cy="30" r="6" fill="#3A3540"/>
    <circle cx="56" cy="30" r="6" fill="#3A3540"/>
    <circle cx="78" cy="30" r="6" fill="#3A3540"/>
    <line x1="0" y1="58" x2="780" y2="58" stroke="#26242C" stroke-width="1.5"/>

    <!-- Inner Gradient Stage -->
    <rect x="36" y="92" width="380" height="24" rx="12" fill="#FAFAFC" fill-opacity="0.14"/>
    <rect x="36" y="136" width="290" height="14" rx="7" fill="#FAFAFC" fill-opacity="0.08"/>
    <rect x="36" y="192" width="708" height="340" rx="20" fill="url(#c-card-sheen)" stroke="#FAFAFC" stroke-opacity="0.12" stroke-width="1.5"/>
  </g>

  <!-- Hybrid Mobile Device Silhouette -->
  <g transform="translate(768, 148) rotate(3)">
    <rect x="-10" y="12" width="324" height="632" rx="48" fill="#000000" opacity="0.5"/>
    <rect width="316" height="624" rx="46" fill="#18181E" stroke="#36323C" stroke-width="2.5"/>
    <rect x="14" y="14" width="288" height="596" rx="34" fill="url(#c-phone-fill)"/>
    <rect x="116" y="28" width="84" height="18" rx="9" fill="#0A0A0C" fill-opacity="0.72"/>
    <rect x="38" y="88" width="240" height="220" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="38" y="330" width="240" height="120" rx="18" fill="#FFFFFF" fill-opacity="0.06"/>
    <rect x="38" y="470" width="160" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.16"/>
    <rect x="38" y="502" width="210" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.1"/>
  </g>
</svg>
