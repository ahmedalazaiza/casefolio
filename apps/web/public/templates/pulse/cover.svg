<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <radialGradient id="pulseCoralGlow" cx="70%" cy="38%" r="54%">
      <stop offset="0%" stop-color="#FF5B3A" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#FF5B3A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D0D12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulseLimeGlow" cx="24%" cy="76%" r="46%">
      <stop offset="0%" stop-color="#D4FF3A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0D0D12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulseCoralCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5B3A"/>
      <stop offset="100%" stop-color="#E03E1F"/>
    </linearGradient>
    <filter id="pulsePhoneShadow" x="-12%" y="-10%" width="124%" height="124%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#0D0D12"/>
  <rect width="1200" height="900" fill="url(#pulseCoralGlow)"/>
  <rect width="1200" height="900" fill="url(#pulseLimeGlow)"/>

  <!-- Left Editorial Narrative & Outcomes -->
  <g transform="translate(68, 72)">
    <rect width="248" height="36" rx="18" fill="#17171F" stroke="#2A2A36"/>
    <circle cx="22" cy="18" r="5" fill="#FF5B3A"/>
    <text x="38" y="23" fill="#D4FF3A" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em">CASE STUDY · iOS &amp; ANDROID</text>

    <text x="0" y="96" fill="#F4F4F6" font-family="system-ui,-apple-system,sans-serif" font-size="46" font-weight="800" letter-spacing="-0.03em">Pulse: a fitness</text>
    <text x="0" y="150" fill="#F4F4F6" font-family="system-ui,-apple-system,sans-serif" font-size="46" font-weight="800" letter-spacing="-0.03em">coach that fits</text>
    <text x="0" y="204" fill="#FF5B3A" font-family="system-ui,-apple-system,sans-serif" font-size="46" font-weight="800" letter-spacing="-0.03em">into your day</text>

    <text x="0" y="252" fill="#9B9BAA" font-family="system-ui,-apple-system,sans-serif" font-size="17" font-weight="500">Habit-first 10-minute workouts, adaptive sessions,</text>
    <text x="0" y="278" fill="#9B9BAA" font-family="system-ui,-apple-system,sans-serif" font-size="17" font-weight="500">and forgiving streaks built for busy schedules.</text>

    <!-- Tags -->
    <g transform="translate(0, 308)">
      <rect width="108" height="32" rx="16" fill="#22222D" stroke="#2A2A36"/>
      <text x="54" y="21" text-anchor="middle" fill="#F4F4F6" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600">Mobile App</text>
      <rect x="118" width="114" height="32" rx="16" fill="#22222D" stroke="#2A2A36"/>
      <text x="175" y="21" text-anchor="middle" fill="#F4F4F6" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600">UX Research</text>
      <rect x="242" width="108" height="32" rx="16" fill="#22222D" stroke="#2A2A36"/>
      <text x="296" y="21" text-anchor="middle" fill="#D4FF3A" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600">ProtoPie</text>
    </g>

    <!-- Outcomes Coral Card -->
    <g transform="translate(0, 376)">
      <rect width="436" height="236" rx="24" fill="url(#pulseCoralCard)"/>
      <text x="28" y="42" fill="#FFE4DE" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em">OUTCOMES · 250,000 DOWNLOADS</text>
      <text x="28" y="102" fill="#FFFFFF" font-family="system-ui,-apple-system,sans-serif" font-size="48" font-weight="800">+58%</text>
      <text x="28" y="128" fill="#FFE4DE" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600">Day-30 retention</text>

      <text x="196" y="102" fill="#D4FF3A" font-family="system-ui,-apple-system,sans-serif" font-size="44" font-weight="800">2.4×</text>
      <text x="196" y="128" fill="#FFE4DE" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600">Workouts / wk</text>

      <text x="328" y="102" fill="#FFFFFF" font-family="system-ui,-apple-system,sans-serif" font-size="38" font-weight="800">4.8★</text>
      <text x="328" y="128" fill="#FFE4DE" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600">App Store</text>

      <line x1="28" y1="156" x2="408" y2="156" stroke="#FFFFFF" stroke-opacity="0.24"/>
      <text x="28" y="190" fill="#FFFFFF" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700">“Ten minutes felt doable, so I actually did it —</text>
      <text x="28" y="212" fill="#FFE4DE" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="500">every day for three months.” — Maya Okafor, London</text>
    </g>

    <!-- Bottom Forgiving Streak Pill -->
    <g transform="translate(0, 640)">
      <rect width="436" height="86" rx="18" fill="#17171F" stroke="#2A2A36" stroke-width="1.5"/>
      <circle cx="44" cy="43" r="22" fill="#D4FF3A"/>
      <path d="M36 43L42 49L53 37" stroke="#0D0D12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="38" fill="#F4F4F6" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700">Forgiving Streak Shield Active</text>
      <text x="80" y="60" fill="#9B9BAA" font-family="system-ui,-apple-system,sans-serif" font-size="13">18-day habit streak preserved across busy workdays</text>
    </g>
  </g>

  <!-- Right Side: Dual Staggered iPhone 16 Pro Frames -->
  <!-- Phone 1: Live Workout Screen -->
  <g transform="translate(556, 86)" filter="url(#pulsePhoneShadow)">
    <rect width="288" height="618" rx="46" fill="#22222D" stroke="#3A3A4A" stroke-width="3"/>
    <rect x="10" y="10" width="268" height="598" rx="38" fill="#0D0D12"/>
    <rect x="96" y="22" width="96" height="24" rx="12" fill="#17171F"/>

    <g transform="translate(26, 68)">
      <text x="0" y="18" fill="#D4FF3A" font-family="ui-monospace,monospace" font-size="11" font-weight="700" letter-spacing="0.08em">TODAY'S 10-MIN MICRO SESSION</text>
      <text x="0" y="48" fill="#F4F4F6" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="800">Core &amp; Mobility Express</text>

      <!-- Circular Workout Timer Ring -->
      <g transform="translate(118, 174)">
        <circle r="86" stroke="#22222D" stroke-width="14"/>
        <circle r="86" stroke="#FF5B3A" stroke-width="14" stroke-dasharray="410 540" stroke-linecap="round" transform="rotate(-90)"/>
        <text x="0" y="8" text-anchor="middle" fill="#F4F4F6" font-family="system-ui,-apple-system,sans-serif" font-size="40" font-weight="800">06:42</text>
        <text x="0" y="34" text-anchor="middle" fill="#D4FF3A" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700">ROUND 3 OF 4 · 138 BPM</text>
      </g>

      <!-- Up Next Exercise Card -->
      <rect y="290" width="236" height="92" rx="18" fill="#17171F" stroke="#2A2A36"/>
      <text x="18" y="320" fill="#9B9BAA" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700">CURRENT MOVE · 45 SEC</text>
      <text x="18" y="346" fill="#F4F4F6" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700">Plank Shoulder Taps</text>
      <text x="18" y="368" fill="#D4FF3A" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600">No equipment · Low impact option ready</text>

      <!-- One-Handed Primary Action -->
      <rect y="404" width="236" height="54" rx="27" fill="#FF5B3A"/>
      <text x="118" y="437" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="800">Complete Round · Next</text>

      <rect y="472" width="236" height="44" rx="22" fill="#17171F"/>
      <text x="118" y="499" text-anchor="middle" fill="#9B9BAA" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600">Swap to 5-min low-energy mode</text>
    </g>
  </g>

  <!-- Phone 2: Streaks & Progress Screen -->
  <g transform="translate(868, 178)" filter="url(#pulsePhoneShadow)">
    <rect width="272" height="584" rx="44" fill="#22222D" stroke="#3A3A4A" stroke-width="3"/>
    <rect x="10" y="10" width="252" height="564" rx="36" fill="#17171F"/>
    <rect x="90" y="22" width="92" height="22" rx="11" fill="#0D0D12"/>

    <g transform="translate(24, 66)">
      <text x="0" y="18" fill="#9B9BAA" font-family="ui-monospace,monospace" font-size="11" font-weight="700">FORGIVING STREAKS</text>
      <text x="0" y="50" fill="#F4F4F6" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="800">18-Day Rhythm</text>

      <!-- Weekly Streak Dots -->
      <g transform="translate(0, 74)">
        <rect width="224" height="84" rx="16" fill="#0D0D12" stroke="#2A2A36"/>
        <circle cx="28" cy="42" r="13" fill="#D4FF3A"/>
        <circle cx="60" cy="42" r="13" fill="#D4FF3A"/>
        <circle cx="92" cy="42" r="13" fill="#D4FF3A"/>
        <circle cx="124" cy="42" r="13" fill="#22222D" stroke="#D4FF3A" stroke-width="2" stroke-dasharray="3 3"/>
        <circle cx="156" cy="42" r="13" fill="#D4FF3A"/>
        <circle cx="188" cy="42" r="13" fill="#FF5B3A"/>
        <text x="18" y="74" fill="#9B9BAA" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600">Thu rest-day shield kept your streak alive</text>
      </g>

      <!-- Weekly Activity Bars -->
      <rect y="178" width="224" height="176" rx="18" fill="#0D0D12" stroke="#2A2A36"/>
      <text x="18" y="208" fill="#F4F4F6" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="700">Weekly Consistency</text>
      <text x="18" y="228" fill="#D4FF3A" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700">48 mins trained · +120% vs Wk 1</text>
      <rect x="24" y="294" width="20" height="42" rx="6" fill="#D4FF3A"/>
      <rect x="54" y="274" width="20" height="62" rx="6" fill="#D4FF3A"/>
      <rect x="84" y="262" width="20" height="74" rx="6" fill="#D4FF3A"/>
      <rect x="114" y="310" width="20" height="26" rx="6" fill="#2A2A36"/>
      <rect x="144" y="256" width="20" height="80" rx="6" fill="#D4FF3A"/>
      <rect x="174" y="246" width="20" height="90" rx="6" fill="#FF5B3A"/>

      <!-- 3-Question Onboarding Badge -->
      <rect y="374" width="224" height="106" rx="18" fill="#22222D" stroke="#FF5B3A" stroke-width="1.5"/>
      <text x="18" y="406" fill="#FF5B3A" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700">3-QUESTION QUICK SETUP</text>
      <text x="18" y="434" fill="#F4F4F6" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="800">2.0× First Workout</text>
      <text x="18" y="458" fill="#9B9BAA" font-family="system-ui,-apple-system,sans-serif" font-size="12">Cut from 18 onboarding steps to 3</text>
    </g>
  </g>
</svg>

