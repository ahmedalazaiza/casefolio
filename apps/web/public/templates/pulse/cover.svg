  <!-- Right Column: Exact Figma 120:6672 Mockup Stage + device/iphone -->
  <g transform="translate(868, 128)">
    <rect width="452" height="825" rx="40" fill="#17171F" stroke="#2A2A36" stroke-width="1"/>
