<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" fill="none">
  <rect width="1440" height="1080" fill="#0D0D12"/>

  <!-- Left Column: Exact Figma 120:6652 Hero Copy -->
  <g transform="translate(120, 206)">
    <!-- 72x72 Logo Slot -->
    <rect width="72" height="72" rx="18" fill="#22222D"/>
    <g transform="translate(25, 25)" stroke="#626273" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="2.5" width="17" height="17" rx="2.5"/>
      <circle cx="7.8" cy="7.8" r="1.6"/>
      <path d="M3 16.5L8.5 11.2L13.2 15.5L16 13L19 16"/>
    </g>

    <!-- Eyebrow -->
    <text x="0" y="114" fill="#D4FF3A" font-family="DM Sans, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" letter-spacing="1.68">CASE STUDY · IOS &amp; ANDROID</text>

    <!-- Title -->
    <text x="0" y="186" fill="#F4F4F6" font-family="Sora, system-ui, -apple-system, sans-serif" font-size="64" font-weight="600">Pulse: a fitness</text>
    <text x="0" y="253" fill="#F4F4F6" font-family="Sora, system-ui, -apple-system, sans-serif" font-size="64" font-weight="600">coach that fits</text>
    <text x="0" y="320" fill="#F4F4F6" font-family="Sora, system-ui, -apple-system, sans-serif" font-size="64" font-weight="600">into your day</text>

    <!-- Subtitle -->
    <text x="0" y="372" fill="#9B9BAA" font-family="DM Sans, system-ui, -apple-system, sans-serif" font-size="21" font-weight="400">Designing a habit-first workout app that helps busy</text>
    <text x="0" y="405" fill="#9B9BAA" font-family="DM Sans, system-ui, -apple-system, sans-serif" font-size="21" font-weight="400">people train ten minutes at a time.</text>

    <!-- Tags -->
    <g transform="translate(0, 444)">
      <rect x="0" y="0" width="108" height="34" rx="17" stroke="#2A2A36" stroke-width="1"/>
      <text x="54" y="22" text-anchor="middle" fill="#F4F4F6" font-family="DM Sans, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Mobile App</text>

      <rect x="116" y="0" width="118" height="34" rx="17" stroke="#2A2A36" stroke-width="1"/>
      <text x="175" y="22" text-anchor="middle" fill="#F4F4F6" font-family="DM Sans, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">UX Research</text>

      <rect x="242" y="0" width="154" height="34" rx="17" stroke="#2A2A36" stroke-width="1"/>
      <text x="319" y="22" text-anchor="middle" fill="#F4F4F6" font-family="DM Sans, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Interaction Design</text>

      <rect x="404" y="0" width="110" height="34" rx="17" stroke="#2A2A36" stroke-width="1"/>
      <text x="459" y="22" text-anchor="middle" fill="#F4F4F6" font-family="DM Sans, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Prototyping</text>
    </g>
