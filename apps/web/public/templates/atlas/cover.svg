      <text x="22" y="344" fill="#D1FAE5" font-family="system-ui,-apple-system,sans-serif" font-size="12">Replaced per trip</text>
      <line x1="22" y1="362" x2="260" y2="362" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="22" y="404" fill="#FFFFFF" font-family="Georgia,serif" font-size="28" font-weight="700">+36%</text>
      <text x="22" y="426" fill="#D1FAE5" font-family="system-ui,-apple-system,sans-serif" font-size="11">Planned end-to-end</text>
      <text x="150" y="404" fill="#E8743B" font-family="Georgia,serif" font-size="28" font-weight="700">92%</text>
      <text x="150" y="426" fill="#D1FAE5" font-family="system-ui,-apple-system,sans-serif" font-size="11">Offline ticket success</text>
