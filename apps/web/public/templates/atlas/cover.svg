<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <radialGradient id="atlasWarmGlow" cx="72%" cy="34%" r="58%">
      <stop offset="0%" stop-color="#E8743B" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#0F5C4D" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FBF7F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="atlasForestCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F5C4D"/>
      <stop offset="100%" stop-color="#093D33"/>
    </linearGradient>
    <filter id="atlasShadow" x="-10%" y="-8%" width="120%" height="122%">
