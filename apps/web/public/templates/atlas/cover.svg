      <rect x="38" y="252" width="172" height="52" rx="6" fill="#1D1A16"/>
      <text x="124" y="283" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace,monospace" font-size="12" font-weight="700">CACHED QR PASS · READY</text>

