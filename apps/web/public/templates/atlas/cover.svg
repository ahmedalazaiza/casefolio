      <text x="20" y="124" fill="#A7F3D0" font-family="ui-monospace,monospace" font-size="10" font-weight="700">SHINKANSEN NOZOMI #207</text>
      <text x="20" y="146" fill="#FFFFFF" font-family="Georgia,serif" font-size="20" font-weight="700">TYO  →  KYO</text>
      <text x="228" y="146" text-anchor="end" fill="#E8743B" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="800">08:30</text>

      <text x="20" y="192" fill="#6F675C" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700">PLATFORM</text>
      <text x="20" y="214" fill="#1D1A16" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="800">Track 16</text>
      <text x="132" y="192" fill="#6F675C" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700">CAR &amp; SEAT</text>
      <text x="132" y="214" fill="#1D1A16" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="800">Car 7 · 4E</text>

