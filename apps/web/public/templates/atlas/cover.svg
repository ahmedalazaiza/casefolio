    <line x1="0" y1="58" x2="780" y2="58" stroke="#EFE8DC" stroke-width="1.5"/>
    <circle cx="34" cy="29" r="6" fill="#D9CEBC"/>
    <circle cx="56" cy="29" r="6" fill="#D9CEBC"/>
    <circle cx="78" cy="29" r="6" fill="#D9CEBC"/>

    <rect x="36" y="92" width="220" height="16" rx="8" fill="#0F5C4D" fill-opacity="0.32"/>
    <rect x="36" y="124" width="380" height="22" rx="11" fill="#1D1A16" fill-opacity="0.12"/>
    <rect x="36" y="176" width="708" height="356" rx="20" fill="url(#a-web-stage)" stroke="#E6DDCF" stroke-width="1.5"/>
  </g>

  <!-- Matching Companion Mobile Frame -->
