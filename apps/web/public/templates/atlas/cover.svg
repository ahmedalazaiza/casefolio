    <circle cx="20" cy="17" r="5" fill="#E8743B"/>
    <text x="34" y="22" fill="#0F5C4D" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em">CASE STUDY · WEB + MOBILE</text>
    <text x="0" y="72" fill="#1D1A16" font-family="Georgia,serif" font-size="36" font-weight="700" letter-spacing="-0.02em">Atlas: plan on your laptop, live it on your phone</text>
    <text x="0" y="102" fill="#6F675C" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="500">Cross-platform travel planner · Real-time itinerary sync · Offline boarding passes &amp; maps</text>
  </g>

  <!-- Left/Center Desktop Browser Window: "Plan with room to think" -->
  <g transform="translate(64, 180)" filter="url(#atlasShadow)">
