      <rect x="16" y="84" width="68" height="24" rx="12" fill="#0F5C4D"/>
      <text x="50" y="100" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700">DAY 03</text>
      <text x="96" y="101" fill="#1D1A16" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700">Tokyo Station → Kyoto Shinkansen Nozomi</text>
      <text x="16" y="132" fill="#6F675C" font-family="system-ui,-apple-system,sans-serif" font-size="13">08:30 Depart Track 16 · Car 7 Seat 4E · Cached offline</text>
