    </filter>
  </defs>

  <rect width="1200" height="900" fill="#FBF7F1"/>
  <rect width="1200" height="900" fill="url(#atlasWarmGlow)"/>

  <!-- Top Header Pill & Headline -->
  <g transform="translate(64, 46)">
