    <rect width="1072" height="58" rx="16" fill="#FFFFFF" stroke="#E6DDCF"/>
    <text x="26" y="35" fill="#1D1A16" font-family="Georgia,serif" font-size="15" font-weight="700">Design once, adapt twice — spacious web itinerary builder + offline-first mobile companion</text>
    <text x="1046" y="35" text-anchor="end" fill="#0F5C4D" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700">Web · iOS · Android · 4.7★ Store Rating</text>
  </g>
