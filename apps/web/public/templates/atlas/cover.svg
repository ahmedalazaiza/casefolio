      <rect y="358" width="248" height="106" rx="18" fill="#F0E5D4" stroke="#E8743B" stroke-width="1.5"/>
      <text x="18" y="388" fill="#E8743B" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700">OFFLINE WALKING MAP</text>
      <text x="18" y="414" fill="#1D1A16" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="700">Kyoto Station → Hotel Kanra</text>
      <text x="18" y="440" fill="#6F675C" font-family="system-ui,-apple-system,sans-serif" font-size="12">9 min walk · Exit Central Gate North</text>

      <rect y="480" width="248" height="50" rx="25" fill="#E8743B"/>
      <text x="124" y="510" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="800">Open Offline Map · 4.7★</text>
