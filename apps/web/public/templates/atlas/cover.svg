<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <radialGradient id="a-glow-a" cx="26%" cy="24%" r="60%">
      <stop offset="0%" stop-color="#0F5C4D" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FBF7F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a-glow-b" cx="80%" cy="76%" r="55%">
      <stop offset="0%" stop-color="#E8743B" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FBF7F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a-web-stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F5C4D" stop-opacity="0.2"/>
      <stop offset="55%" stop-color="#F1EADF"/>
      <stop offset="100%" stop-color="#E8743B" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="a-phone-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F5C4D" stop-opacity="0.32"/>
      <stop offset="52%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8743B" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#FBF7F1"/>
  <rect width="1200" height="900" fill="url(#a-glow-a)"/>
  <rect width="1200" height="900" fill="url(#a-glow-b)"/>

  <!-- Editorial Light Web Frame -->
  <g transform="translate(88, 120)">
    <rect x="0" y="10" width="780" height="580" rx="28" fill="#1D1A16" opacity="0.06"/>
