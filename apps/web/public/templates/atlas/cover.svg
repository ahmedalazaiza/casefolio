<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" fill="none">
  <!-- Background -->
  <rect width="1440" height="1080" fill="#FBF7F1"/>

  <!-- Logo slot (72x72, rounded 18px) -->
  <rect x="684" y="64" width="72" height="72" rx="18" fill="#F1EADF"/>
  <g transform="translate(710, 90)" stroke="#6F675C" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.5" y="1.5" width="17" height="17" rx="2.5"/>
    <circle cx="6.5" cy="6.5" r="1.5"/>
    <path d="M18.5 13L14.2 8.7L4.5 18.5"/>
  </g>

  <!-- Eyebrow -->
  <text x="720" y="172" text-anchor="middle" fill="#E8743B" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" letter-spacing="1.68">CASE STUDY · WEB + MOBILE</text>

  <!-- Title -->
  <text x="720" y="244" text-anchor="middle" fill="#1D1A16" font-family="Fraunces, Georgia, serif" font-size="64" font-weight="600">Atlas: plan on your laptop, live it</text>
  <text x="720" y="314" text-anchor="middle" fill="#1D1A16" font-family="Fraunces, Georgia, serif" font-size="64" font-weight="600">on your phone</text>

  <!-- Subtitle -->
  <text x="720" y="368" text-anchor="middle" fill="#6F675C" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">A cross-platform travel planner that keeps itineraries, bookings and maps in</text>
  <text x="720" y="398" text-anchor="middle" fill="#6F675C" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">sync — from first idea to final boarding pass.</text>

  <!-- Tags -->
  <g transform="translate(442, 424)">
    <rect x="0" y="0" width="135" height="36" rx="18" fill="none" stroke="#E6DDCF"/>
    <text x="67.5" y="23" text-anchor="middle" fill="#1D1A16" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Product Design</text>

    <rect x="143" y="0" width="143" height="36" rx="18" fill="none" stroke="#E6DDCF"/>
    <text x="214.5" y="23" text-anchor="middle" fill="#1D1A16" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Responsive Web</text>

    <rect x="294" y="0" width="123" height="36" rx="18" fill="none" stroke="#E6DDCF"/>
    <text x="355.5" y="23" text-anchor="middle" fill="#1D1A16" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">iOS &amp; Android</text>

    <rect x="425" y="0" width="132" height="36" rx="18" fill="none" stroke="#E6DDCF"/>
    <text x="491" y="23" text-anchor="middle" fill="#1D1A16" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Design System</text>
  </g>

  <!-- Browser Mockup Frame (1200w) -->
  <g transform="translate(120, 504)">
    <rect width="1200" height="540" rx="14" fill="#FFFFFF" stroke="#E6DDCF"/>
    <circle cx="21" cy="17" r="5" fill="#E6DDCF"/>
    <circle cx="39" cy="17" r="5" fill="#E6DDCF"/>
    <circle cx="57" cy="17" r="5" fill="#E6DDCF"/>
    <rect x="1" y="34" width="1198" height="505" rx="0" fill="#F1EADF"/>
    <g transform="translate(572, 258)" stroke="#6F675C" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="48" height="48" rx="6"/>
      <circle cx="18" cy="18" r="4"/>
      <path d="M52 36L40 24L12 52"/>
    </g>
  </g>
</svg>
