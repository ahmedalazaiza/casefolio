      <circle cx="40" cy="176" r="8" fill="#FFFFFF" stroke="#0F5C4D" stroke-width="4"/>
      <circle cx="152" cy="116" r="8" fill="#E8743B" stroke="#FFFFFF" stroke-width="3"/>
