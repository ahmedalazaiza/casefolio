    <rect width="796" height="46" rx="22" fill="#F1EADF"/>
    <rect y="26" width="796" height="20" fill="#F1EADF"/>
    <circle cx="24" cy="23" r="6" fill="#E8743B"/>
    <circle cx="44" cy="23" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="23" r="6" fill="#0F5C4D"/>
    <rect x="210" y="10" width="376" height="26" rx="8" fill="#FFFFFF" stroke="#E6DDCF"/>
    <text x="398" y="27" text-anchor="middle" fill="#6F675C" font-family="ui-monospace,monospace" font-size="11" font-weight="600">atlas.travel/trips/kyoto-autumn-10d</text>

