    <rect x="116" y="28" width="84" height="18" rx="9" fill="#1D1A16" fill-opacity="0.16"/>
    <rect x="38" y="88" width="240" height="220" rx="22" fill="#0F5C4D" fill-opacity="0.12" stroke="#0F5C4D" stroke-opacity="0.18"/>
    <rect x="38" y="332" width="240" height="120" rx="18" fill="#E8743B" fill-opacity="0.12"/>
    <rect x="38" y="476" width="160" height="16" rx="8" fill="#1D1A16" fill-opacity="0.16"/>
    <rect x="38" y="508" width="210" height="12" rx="6" fill="#1D1A16" fill-opacity="0.09"/>
