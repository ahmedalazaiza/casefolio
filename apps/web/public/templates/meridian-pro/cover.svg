<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <radialGradient id="m-glow-a" cx="26%" cy="22%" r="60%">
      <stop offset="0%" stop-color="#5B4BFF" stop-opacity="0.52"/>
      <stop offset="55%" stop-color="#18E0C8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0E0F1A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-glow-b" cx="78%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#18E0C8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0E0F1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m-window" x1="110" y1="110" x2="1090" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C1E33"/>
      <stop offset="55%" stop-color="#151728"/>
      <stop offset="100%" stop-color="#101A26"/>
    </linearGradient>
    <linearGradient id="m-hero-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B4BFF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#18E0C8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFB547" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#0E0F1A"/>
  <rect width="1200" height="900" fill="url(#m-glow-a)"/>
  <rect width="1200" height="900" fill="url(#m-glow-b)"/>

  <!-- Clean Web SaaS Browser Frame -->
  <g transform="translate(104, 108)">
    <rect x="-8" y="14" width="1008" height="700" rx="30" fill="#06070D" opacity="0.55"/>
    <rect width="992" height="684" rx="28" fill="url(#m-window)" stroke="#2B2E4A" stroke-width="2"/>
    <line x1="0" y1="58" x2="992" y2="58" stroke="#262944" stroke-width="1.5"/>
    <circle cx="34" cy="29" r="6" fill="#3D426B"/>
    <circle cx="56" cy="29" r="6" fill="#3D426B"/>
    <circle cx="78" cy="29" r="6" fill="#3D426B"/>

    <!-- Minimal Sidebar + Gradient Workspace Panel -->
    <rect x="34" y="90" width="210" height="558" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="56" y="118" width="120" height="14" rx="7" fill="#5B4BFF" fill-opacity="0.55"/>
    <rect x="56" y="156" width="164" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="56" y="182" width="136" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="56" y="208" width="148" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.08"/>

    <rect x="272" y="90" width="684" height="330" rx="20" fill="url(#m-hero-panel)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="272" y="446" width="328" height="202" rx="18" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect x="628" y="446" width="328" height="202" rx="18" fill="#18E0C8" fill-opacity="0.1" stroke="#18E0C8" stroke-opacity="0.22"/>
  </g>
</svg>
